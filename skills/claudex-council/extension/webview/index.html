<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="{{CSP}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{CSS_URI}}">
  <title>Claudex Council</title>
</head>
<body>
  <div class="probe-banner" id="probeBanner" hidden></div>

  <header class="council-topbar">
    <div class="council-brand">
      <span class="dot dot-decider"></span>
      <div>
        <div class="council-brand-main">Claudex Council</div>
        <div class="council-subtitle">One shared Claude + Codex session</div>
      </div>
    </div>

    <details class="model-drawer" id="modelDrawer">
      <summary>Model routing</summary>
      <div class="model-bar" id="modelBar" aria-label="Model routing">
        <div class="ms ms-plan">
          <span class="dot dot-planner"></span>
          <label>Coordinator</label>
          <select data-slot="planner" aria-label="Coordinator model"></select>
        </div>
        <div class="ms">
          <span class="dot dot-claude"></span>
          <label>Claude lane</label>
          <select data-slot="claudeWorker" aria-label="Claude lane model"></select>
        </div>
        <div class="ms">
          <span class="dot dot-codex"></span>
          <label>Codex lane</label>
          <select data-slot="codexWorker" aria-label="Codex lane model"></select>
        </div>
        <div class="ms">
          <span class="dot dot-decider"></span>
          <label>Council answer</label>
          <select data-slot="decider" aria-label="Council answer model"></select>
        </div>
        <div class="ms-actions">
          <button id="resetModels" class="ms-action-btn" title="Reset model picks to recommended defaults">Reset</button>
          <button id="refreshCatalog" class="ms-action-btn" title="Refresh model list">Refresh</button>
        </div>
      </div>
    </details>
  </header>

  <main class="transcript" id="transcript">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="9" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
          <circle cx="15" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor"/>
        </svg>
      </div>
      <h2>One council, one answer.</h2>
      <p>Ask normally. Claude and Codex coordinate in the background, share session context, and surface only merged questions or the final response.</p>
    </div>
  </main>

  <footer class="composer">
    <div class="attachments" id="attachments" hidden></div>
    <div class="composer-row">
      <button class="icon-btn" id="attachBtn" title="Attach screenshot or image" aria-label="Attach image">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.49" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea
        id="prompt"
        placeholder="Ask the council..."
        rows="1"
        autofocus></textarea>
      <button class="icon-btn stop-btn" id="stopBtn" title="Stop running agents" aria-label="Stop running agents" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" title="Send (Enter)" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="composer-hint">
      <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline · paste or drop images</span>
    </div>
  </footer>

  <script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
</body>
</html>
